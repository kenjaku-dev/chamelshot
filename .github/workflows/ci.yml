name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pyright .

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv build

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv build
      - name: Upload to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: '[[ -n "$UV_PUBLISH_TOKEN" ]] && uv publish || echo "No PYPI_TOKEN set, skipping PyPI publish"'

  appimage:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev libfuse2
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Build AppImage
        run: bash packaging/build-appimage.sh ${GITHUB_REF_NAME#v}
      - name: Upload AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${GITHUB_REF_NAME} dist/snapcap-${GITHUB_REF_NAME#v}-x86_64.AppImage --clobber
