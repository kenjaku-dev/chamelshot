name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python scripts/check_version.py

  security:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Audit runtime dependencies (pip-audit)
        run: |
          uv export --no-hashes --no-emit-project --format requirements-txt -o /tmp/reqs.txt
          uvx pip-audit --requirement /tmp/reqs.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pyright .

  test:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev libfuse2 libegl1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: QT_QPA_PLATFORM=offscreen dbus-run-session -- uv run pytest -n auto --dist loadscope -q --cov --cov-report=term-missing --cov-fail-under=40

  build:
    runs-on: ubuntu-latest
    needs: [version-check, lint, typecheck, test]
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Compute AUR source checksum (tag tarball)
        run: |
          tarball="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sum="$(curl -fsSL "$tarball" | sha256sum | cut -d' ' -f1)"
          echo "AUR sha256sum for $GITHUB_REF_NAME: $sum"
          {
            echo "### AUR PKGBUILD sha256sums"
            echo '```'
            echo "$sum  $GITHUB_REF_NAME.tar.gz"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk '/^## v'"$ver"'/{f=1;next} /^## /{f=0} f' CHANGELOG.md > release_notes.md
          head -5 release_notes.md
      - name: Upload to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: '[[ -n "$UV_PUBLISH_TOKEN" ]] && uv publish || echo "No PYPI_TOKEN set, skipping PyPI publish"'
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release_notes.md 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz --clobber

  appimage:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libgirepository-2.0-dev libcairo2-dev libfuse2
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Build AppImage
        run: bash packaging/build-appimage.sh ${GITHUB_REF_NAME#v}
      - name: Upload AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="chamelshot-${GITHUB_REF_NAME#v}-x86_64.AppImage"
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /dev/null 2>/dev/null || true
          gh release delete-asset "${GITHUB_REF_NAME}" "${asset}" --yes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" "dist/${asset}"
