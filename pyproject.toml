[project]
name = "chamelshot"
version = "5.0.0"
license = "GPL-3.0-only"
description = "A lightweight screenshot capture tool for Wayland (wlroots)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.1",
    "pygobject>=3.56.0",
]

[project.scripts]
chamelshot = "main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120
lint.select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "N999"]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = false
exclude = [
    "build",
    "dist",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "*.egg-info",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["__init__", "version", "dispatcher", "ipc", "editor", "main", "capture", "clipboard", "config", "history", "overlay", "pin", "proc", "preview", "settings", "tray"]

[tool.setuptools.data-files]
"share/applications" = ["packaging/chamelshot.desktop"]
"share/icons/hicolor/256x256/apps" = ["packaging/chamelshot.png"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "dbus-python>=1.4.0",
    "pyinstaller>=6.21.0",
]
